<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="42%" stop-color="#163a7a"/>
      <stop offset="100%" stop-color="#0d5c56"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="2400" height="1600" fill="url(#sky)"/>
  <rect width="2400" height="1600" fill="url(#sun)"/>
  <ellipse cx="520" cy="360" rx="460" ry="280" fill="#1d4ed8" opacity="0.22" filter="url(#soft)"/>
  <ellipse cx="1880" cy="1180" rx="540" ry="320" fill="#14b8a6" opacity="0.2" filter="url(#soft)"/>

  <!-- distant hills -->
  <path d="M0 980 C320 860 560 920 820 880 C1100 830 1320 760 1600 790 C1880 820 2100 900 2400 860 L2400 1600 L0 1600 Z" fill="#0b2348" opacity="0.55"/>
  <path d="M0 1080 C380 980 700 1040 980 1000 C1280 955 1500 900 1780 940 C2060 980 2220 1040 2400 1010 L2400 1600 L0 1600 Z" fill="#0a2f3a" opacity="0.45"/>

  <!-- ledger / stock silhouettes -->
  <g opacity="0.16" fill="#e2e8f0">
    <rect x="160" y="520" width="420" height="280" rx="20"/>
    <rect x="200" y="560" width="200" height="14" rx="7"/>
    <rect x="200" y="600" width="340" height="10" rx="5"/>
    <rect x="200" y="630" width="300" height="10" rx="5"/>
    <rect x="200" y="680" width="340" height="80" rx="10"/>
  </g>
  <g opacity="0.14" fill="#e2e8f0">
    <rect x="640" y="580" width="180" height="220" rx="14"/>
    <rect x="850" y="540" width="180" height="260" rx="14"/>
    <rect x="1060" y="600" width="180" height="200" rx="14"/>
  </g>

  <!-- chart panel -->
  <g opacity="0.9">
    <rect x="1480" y="360" width="700" height="780" rx="32" fill="#f8fafc" opacity="0.07"/>
    <rect x="1540" y="440" width="580" height="40" rx="10" fill="#fff" opacity="0.12"/>
    <rect x="1540" y="520" width="380" height="18" rx="8" fill="#fff" opacity="0.1"/>
    <rect x="1540" y="580" width="580" height="320" rx="18" fill="#1b4fd8" opacity="0.18"/>
    <polyline points="1580,820 1680,740 1780,780 1900,640 2020,700 2080,560"
      fill="none" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <rect width="2400" height="1600" fill="url(#floor)"/>
</svg>
