<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reset password · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
      }
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css?v=20261015m">
</head>
<body data-layout="auth" data-page="login" data-auth="reset">
  <main class="auth-screen">
    <div class="auth-screen-media" aria-hidden="true">
      <picture>
        <source media="(min-width: 768px)" srcset="../assets/images/auth-login-bg.svg">
        <img class="auth-screen-photo" src="../assets/images/auth-login-bg.svg" alt="" width="2400" height="1600" decoding="async">
      </picture>
      <div class="auth-screen-veil"></div>
      <div class="auth-screen-orb auth-screen-orb-a"></div>
      <div class="auth-screen-orb auth-screen-orb-b"></div>
    </div>

    <div class="auth-shell auth-shell-single">
      <section class="auth-card" aria-labelledby="reset-heading">
        <div class="auth-card-body">
          <header class="auth-card-head">
            <span class="auth-card-badge" aria-hidden="true"><i class="bi bi-envelope-lock-fill"></i></span>
            <h2 class="auth-card-title" id="reset-heading">Reset password</h2>
            <p class="auth-card-sub" id="reset-sub">Enter your account email. We will send a 6-digit confirmation code.</p>
          </header>

          <div class="alert alert-danger d-flex align-items-start gap-2 auth-alert" id="reset-error" hidden>
            <i class="bi bi-exclamation-circle-fill flex-shrink-0 mt-1" aria-hidden="true"></i>
            <span id="reset-error-text"></span>
          </div>
          <div class="alert alert-success d-flex align-items-start gap-2 auth-alert" id="reset-success" hidden>
            <i class="bi bi-check-circle-fill flex-shrink-0 mt-1" aria-hidden="true"></i>
            <span id="reset-success-text"></span>
          </div>

          <form id="forgot-form" novalidate>
            <div class="mbms-field auth-field">
              <label class="form-label" for="forgot-email">Email</label>
              <input class="form-control auth-input" id="forgot-email" name="email" type="email" required autocomplete="email" placeholder="your@email.com">
              <div class="invalid-feedback" data-error-for="email">Enter your email.</div>
            </div>
            <button type="submit" class="btn btn-primary mbms-btn-block auth-submit">
              <span class="auth-submit-label"><i class="bi bi-send" aria-hidden="true"></i> Send code</span>
            </button>
          </form>

          <form id="reset-form" novalidate hidden>
            <div class="mbms-field auth-field">
              <label class="form-label" for="reset-email">Email</label>
              <input class="form-control auth-input" id="reset-email" name="email" type="email" required autocomplete="email">
            </div>
            <div class="mbms-field auth-field">
              <label class="form-label" for="reset-code">Confirmation code</label>
              <input class="form-control auth-input" id="reset-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="6-digit code" autocomplete="one-time-code">
              <div class="invalid-feedback" data-error-for="code">Enter the 6-digit code from your email.</div>
            </div>
            <div class="mbms-field auth-field">
              <label class="form-label" for="reset-password">New password</label>
              <input class="form-control auth-input" id="reset-password" name="password" type="password" required autocomplete="new-password" placeholder="New password">
            </div>
            <div class="mbms-field auth-field">
              <label class="form-label" for="reset-password-confirmation">Confirm new password</label>
              <input class="form-control auth-input" id="reset-password-confirmation" name="password_confirmation" type="password" required autocomplete="new-password" placeholder="Confirm password">
            </div>
            <button type="submit" class="btn btn-primary mbms-btn-block auth-submit">
              <span class="auth-submit-label"><i class="bi bi-shield-check" aria-hidden="true"></i> Set new password</span>
            </button>
          </form>

          <p class="auth-card-foot">
            <a class="auth-link" href="login.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to sign in</a>
          </p>
        </div>
      </section>
    </div>
  </main>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js?v=20261015p"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js?v=20261015m"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/pages/forgot-password-page.js?v=20261015m"></script>
  <script defer src="../assets/js/app.js?v=20261015p"></script>
</body>
</html>
