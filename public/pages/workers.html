<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workers · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
}
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-page="workers">
  <div id="page-content">
    <div id="workers-root">
      <div class="alert alert-warning mbms-source-banner" id="source-banner" hidden></div>

      <div id="list-view">
        <div class="mbms-page-header">
          <div>
            <h1><i class="bi bi-person-badge" aria-hidden="true"></i> Workers</h1>
          </div>
          <div class="mbms-page-actions">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#workerModal"><i class="bi bi-person-plus" aria-hidden="true"></i> Add worker</button>
          </div>
        </div>
        <div class="mbms-toolbar">
          <input class="form-control mbms-search" id="module-search" type="search" placeholder="Search workers">
          <select class="form-select mbms-filter" id="list-location" aria-label="Location"></select>
        </div>
      <div class="mbms-summary-row" id="list-summary" hidden></div>
      <ul class="nav nav-tabs mbms-nav-tabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-workers" type="button">Workers</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-monthly" type="button">Monthly payment report</button></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="tab-workers">
            <div id="worker-empty" hidden></div>
            <div class="table-responsive" id="worker-table-wrap">
              <table class="table mbms-table">
                <thead>
                  <tr>
                    <th>Worker name</th>
                    <th>Location</th>
                    <th>Notes</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="worker-list-body"></tbody>
              </table>
            </div>
          </div>
          <div class="tab-pane fade" id="tab-monthly">
<div class="mbms-toolbar">
              <input class="form-control mbms-date" id="report-month" type="month" aria-label="Report month">
            </div>
      <div class="mbms-summary-row" id="monthly-summary" hidden></div>
      <div id="monthly-empty" hidden></div>
            <div class="table-responsive" id="monthly-table-wrap">
              <table class="table mbms-table">
                <thead>
                  <tr>
                    <th>Worker name</th>
                    <th>Month</th>
                    <th>Payment dates</th>
                    <th>Amounts received</th>
                    <th>Monthly total</th>
                  </tr>
                </thead>
                <tbody id="monthly-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div id="detail-view" hidden>
        <div class="mbms-page-header">
          <div>
            <a class="btn btn-outline-secondary btn-sm mb-2" href="workers.html"><i class="bi bi-arrow-left"></i> Back to workers</a>
            <h1 id="detail-title"><i class="bi bi-person-badge" aria-hidden="true"></i> Worker</h1>
            <p class="mbms-detail-meta">
              <span id="detail-location"></span>
            </p>
            <p id="detail-notes"></p>
          </div>
          <div class="mbms-page-actions">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#payModal"><i class="bi bi-cash-coin" aria-hidden="true"></i> Record payment</button>
          </div>
        </div>
        <ul class="nav nav-tabs mbms-nav-tabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-history" type="button">Payment history</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-worker-month" type="button">Monthly report</button></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="tab-history">
            <div id="pay-empty" hidden></div>
            <div class="table-responsive" id="pay-table-wrap">
              <table class="table mbms-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Description</th>
                    <th>User</th>
                    <th>Location</th>
                  </tr>
                </thead>
                <tbody id="pay-body"></tbody>
              </table>
            </div>
          </div>
          <div class="tab-pane fade" id="tab-worker-month">
            <div class="table-responsive">
              <table class="table mbms-table">
                <thead>
                  <tr>
                    <th>Month</th>
                    <th>Payment dates</th>
                    <th>Amounts received</th>
                    <th>Monthly total</th>
                  </tr>
                </thead>
                <tbody id="detail-monthly-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="workerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="worker-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5"><i class="bi bi-person-plus" aria-hidden="true"></i> Add worker</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
<div class="mbms-field">
              <label class="form-label" for="worker-name">Worker name</label>
              <input class="form-control" id="worker-name" name="name" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="worker-location">Location</label>
              <select class="form-select" id="worker-location" name="location"></select>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="worker-notes">Notes</label>
              <textarea class="form-control" id="worker-notes" name="notes" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" id="worker-reset">Reset</button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save worker</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="payModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="pay-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5"><i class="bi bi-cash-coin" aria-hidden="true"></i> Record payment received</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mbms-field">
              <label class="form-label" for="pay-amount">Amount</label>
              <input class="form-control" id="pay-amount" name="amount" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="pay-date">Date</label>
              <input class="form-control" id="pay-date" name="date" type="date" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="pay-description">Description</label>
              <textarea class="form-control" id="pay-description" name="description" rows="2"></textarea>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="pay-user">User</label>
              <input class="form-control" id="pay-user" name="user" value="Signed-in user" readonly>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="pay-location">Location</label>
              <select class="form-select" id="pay-location" name="location" required></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" id="pay-reset">Reset</button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save payment</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/autocomplete.js"></script>
  <script defer src="../assets/js/records.js"></script>
  <script defer src="../assets/js/pages/workers-page.js"></script>
  <script defer src="../assets/js/app.js"></script>
</body>
</html>
