<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stock · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
}
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-page="stock">
  <div id="page-content">
    <div id="stock-root">
      <div class="alert alert-warning mbms-source-banner" id="source-banner" hidden></div>
      <div class="mbms-page-header">
        <div>
          <h1>Stock</h1>
        </div>
      </div>
      <div class="mbms-toolbar">
        <input class="form-control mbms-search" id="module-search" type="search" placeholder="Search stock">
        <select class="form-select mbms-filter" id="list-category" aria-label="Category"></select>
        <select class="form-select mbms-filter" id="list-location" aria-label="Location"></select>
        <select class="form-select mbms-filter" id="movement-type" aria-label="Movement type">
          <option value="">All movements</option>
          <option value="Purchase">Purchase</option>
          <option value="Sale">Sale</option>
          <option value="Return">Return</option>
          <option value="Damage">Damage</option>
        </select>
        <input class="form-control mbms-date" id="date-from" type="date" aria-label="From date">
        <input class="form-control mbms-date" id="date-to" type="date" aria-label="To date">
      </div>

      <ul class="nav nav-tabs mbms-nav-tabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-stock" type="button">Current stock</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-moves" type="button">Stock movements</button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-stock">
          <div id="stock-empty" hidden></div>
          <div class="table-responsive" id="stock-table-wrap">
            <table class="table mbms-table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Product</th>
                  <th>Variant</th>
                  <th>Stock display</th>
                  <th>Location</th>
                </tr>
              </thead>
              <tbody id="stock-body"></tbody>
            </table>
          </div>
        </div>
        <div class="tab-pane fade" id="tab-moves">
          <div id="move-empty" hidden></div>
          <div class="table-responsive" id="move-table-wrap">
            <table class="table mbms-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Product</th>
                  <th>Variant</th>
                  <th>Quantity</th>
                  <th>Location</th>
                  <th>Reference</th>
                </tr>
              </thead>
              <tbody id="move-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/records.js"></script>
  <script defer src="../assets/js/catalog-lookups.js"></script>
  <script defer src="../assets/js/pages/stock-page.js"></script>
  <script defer src="../assets/js/app.js"></script>
</body>
</html>
