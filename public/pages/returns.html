<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Returns · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
      }
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-page="returns">
  <div id="page-content">
    <div id="ret-root">
      <div class="alert alert-warning mbms-source-banner" id="source-banner" hidden></div>
      <div class="mbms-page-header">
        <div>
          <h1>Returns</h1>
        </div>
        <div class="mbms-page-actions">
          <button type="button" class="btn btn-primary" id="open-return-modal" data-bs-toggle="modal" data-bs-target="#retModal">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> New return
          </button>
        </div>
      </div>

      <ul class="nav nav-tabs mbms-nav-tabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="tab-sales-btn" data-return-kind="sale" type="button">Sales returns</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tab-purchases-btn" data-return-kind="purchase" type="button">Purchase returns</button>
        </li>
      </ul>

      <div id="ret-empty" hidden></div>
      <div class="table-responsive mbms-scroll-panel" id="ret-table-wrap">
        <table class="table mbms-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Original</th>
              <th>Product</th>
              <th>Variant</th>
              <th>Quantity</th>
              <th>Reason</th>
              <th>Location</th>
            </tr>
          </thead>
          <tbody id="ret-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="retModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="ret-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="ret-modal-title">Record sales return</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mbms-field">
              <label class="form-label" for="ret-kind">Return type</label>
              <select class="form-select" id="ret-kind" name="kind" required>
                <option value="sale">Sales return</option>
                <option value="purchase">Purchase return</option>
              </select>
            </div>
            <div class="mbms-field" data-sale-fields>
              <label class="form-label" for="ret-sale">Original sale</label>
              <select class="form-select" id="ret-sale" name="sale_id"></select>
            </div>
            <div class="mbms-field" data-purchase-fields hidden>
              <label class="form-label" for="ret-purchase">Original purchase</label>
              <select class="form-select" id="ret-purchase" name="purchase_id"></select>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="ret-product">Product</label>
              <input class="form-control" id="ret-product" name="product" required readonly>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="ret-variant">Variant</label>
              <input class="form-control" id="ret-variant" name="variant" required readonly>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="ret-quantity">Quantity</label>
              <input class="form-control" id="ret-quantity" name="quantity" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="ret-unit">Unit</label>
              <input class="form-control" id="ret-unit" name="unit">
            </div>
            <div class="mbms-field">
              <label class="form-label" for="ret-reason">Reason</label>
              <textarea class="form-control" id="ret-reason" name="reason" rows="2" required></textarea>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="ret-date">Date</label>
              <input class="form-control" id="ret-date" name="date" type="date" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="ret-location">Location</label>
              <select class="form-select" id="ret-location" name="location" required></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" id="ret-reset">Reset</button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Submit return</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/records.js"></script>
  <script defer src="../assets/js/catalog-lookups.js"></script>
  <script defer src="../assets/js/pages/returns-page.js"></script>
  <script defer src="../assets/js/app.js"></script>
</body>
</html>
