<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rice · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
}
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-page="rice" data-catalog="rice">
  <div id="page-content">
    <div id="catalog-root">
      <div class="alert alert-warning mbms-source-banner" id="source-banner" hidden></div>

      <div id="list-view">
        <div class="mbms-page-header">
          <div>
            <h1>Rice</h1>
          </div>
        </div>
        <div class="mbms-toolbar">
          <input class="form-control mbms-search" id="module-search" type="search" placeholder="Search rice types">
          <select class="form-select mbms-filter" id="module-filter" aria-label="Filter rice types"></select>
        </div>
        <div class="table-responsive">
          <table class="table mbms-table">
            <thead>
              <tr>
                <th>Type</th>
                <th>Variants</th>
                <th>Stock display</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="catalog-list-body"></tbody>
          </table>
        </div>
      </div>

      <div id="detail-view" hidden>
        <div class="mbms-page-header">
          <div>
            <a class="btn btn-outline-secondary btn-sm mb-2" href="rice.html"><i class="bi bi-arrow-left"></i> Back to rice list</a>
            <h1 id="detail-title">Rice</h1>
            <p id="detail-note"></p>
          </div>
          <div class="mbms-page-actions">
            <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#purchaseModal">Purchase</button>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#saleModal">Sale</button>
          </div>
        </div>

        <h2 class="h6 mb-2">Stock display</h2>
        <div class="row g-3 mb-3" id="variant-stock"></div>

        <ul class="nav nav-tabs mbms-nav-tabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-variants" type="button">Variants</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-purchases" type="button">Purchase history</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-sales" type="button">Sales history</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-history" type="button">All history</button></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="tab-variants">
            <div class="table-responsive">
              <table class="table mbms-table">
                <thead><tr><th>Size</th><th>Stock display</th><th>Source</th></tr></thead>
                <tbody id="variants-body"></tbody>
              </table>
            </div>
          </div>
          <div class="tab-pane fade" id="tab-purchases">
            <div class="table-responsive">
              <table class="table mbms-table">
                <thead><tr><th>Date</th><th>Supplier</th><th>Size</th><th>Quantity</th><th>Total</th><th>Location</th></tr></thead>
                <tbody id="purchase-history-body"></tbody>
              </table>
            </div>
          </div>
          <div class="tab-pane fade" id="tab-sales">
            <div class="table-responsive">
              <table class="table mbms-table">
                <thead><tr><th>Date</th><th>Customer</th><th>Size</th><th>Quantity</th><th>Total</th><th>Type</th></tr></thead>
                <tbody id="sales-history-body"></tbody>
              </table>
            </div>
          </div>
          <div class="tab-pane fade" id="tab-history">
            <div class="table-responsive">
              <table class="table mbms-table">
                <thead><tr><th>Date</th><th>Type</th><th>Party</th><th>Quantity</th><th>Amount</th></tr></thead>
                <tbody id="all-history-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="purchaseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="purchase-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5">Rice purchase</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="mbms-help">Item: <strong id="purchase-item-label"></strong>. Official totals will be calculated by Laravel.</p>
            <div class="mbms-field">
              <label class="form-label" for="purchase-supplier">Supplier</label>
              <select class="form-select" id="purchase-supplier" name="supplier" required></select>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="purchase-variant">Bag size</label>
              <select class="form-select" id="purchase-variant" name="variant" required></select>
            </div>
            <div class="mbms-field" data-bags-field>
              <label class="form-label" for="purchase-bags">Number of bags</label>
              <input class="form-control" id="purchase-bags" name="bags" inputmode="numeric">
            </div>
            <div class="mbms-field">
              <label class="form-label" for="purchase-quantity">Total quantity</label>
              <input class="form-control" id="purchase-quantity" name="quantity" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="purchase-price">Purchase price</label>
              <input class="form-control" id="purchase-price" name="price">
            </div>
            <div class="mbms-field">
              <label class="form-label" for="purchase-total">Total amount</label>
              <input class="form-control" id="purchase-total" name="total">
            </div>
            <div class="mbms-field">
              <label class="form-label" for="purchase-paid">Paid amount</label>
              <input class="form-control" id="purchase-paid" name="paid">
            </div>
            <div class="mbms-field" data-remaining-field>
              <label class="form-label" for="purchase-remaining">Remaining payable</label>
              <input class="form-control" id="purchase-remaining" name="remaining">
            </div>
            <div class="mbms-field">
              <label class="form-label" for="purchase-date">Date</label>
              <input class="form-control" id="purchase-date" name="date" type="date" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="purchase-location">Location</label>
              <select class="form-select" id="purchase-location" name="location" required></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save purchase</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="saleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="sale-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5">Rice sale</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="mbms-help">Item: <strong id="sale-item-label"></strong></p>
            <p class="mbms-help" id="sale-credit-note"></p>
            <div class="mbms-field">
              <label class="form-label" for="sale-customer">Customer</label>
              <select class="form-select" id="sale-customer" name="customer" required></select>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="sale-variant">Bag size</label>
              <select class="form-select" id="sale-variant" name="variant" required></select>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="sale-quantity">Quantity</label>
              <input class="form-control" id="sale-quantity" name="quantity" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="sale-price">Price</label>
              <input class="form-control" id="sale-price" name="price">
            </div>
            <div class="mbms-field">
              <label class="form-label" for="sale-total">Total</label>
              <input class="form-control" id="sale-total" name="total">
            </div>
            <div class="mbms-field">
              <label class="form-label" for="sale-paid">Paid</label>
              <input class="form-control" id="sale-paid" name="paid">
            </div>
            <div class="mbms-field" data-remaining-field>
              <label class="form-label" for="sale-remaining">Remaining debt</label>
              <input class="form-control" id="sale-remaining" name="remaining">
            </div>
            <div class="mbms-field">
              <label class="form-label" for="sale-payment-type">Payment type</label>
              <select class="form-select" id="sale-payment-type" name="payment_type">
                <option value="cash">Cash</option>
                <option value="credit">Credit</option>
              </select>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="sale-date">Date</label>
              <input class="form-control" id="sale-date" name="date" type="date" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="sale-location">Location</label>
              <select class="form-select" id="sale-location" name="location" required></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save sale</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/records.js"></script>
  <script defer src="../assets/js/pages/catalog-page.js"></script>
  <script defer src="../assets/js/app.js"></script>
</body>
</html>
