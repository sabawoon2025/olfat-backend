<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sales · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
      }
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css?v=20261015j">
</head>
<body data-page="sales" data-transaction="sales">
  <div id="page-content">
    <div id="tx-root">
      <div class="alert alert-warning mbms-source-banner" id="source-banner" hidden></div>
      <div class="mbms-page-header">
        <div>
          <h1><i class="bi bi-cart-check" aria-hidden="true"></i> Sales</h1>
        </div>
        <div class="mbms-page-actions">
          <button type="button" class="btn btn-primary" id="tx-open-new" data-bs-toggle="modal" data-bs-target="#txModal">
            <i class="bi bi-cart-plus" aria-hidden="true"></i> New sale
          </button>
        </div>
      </div>
      <div class="mbms-toolbar">
        <input class="form-control mbms-search" id="module-search" type="search" placeholder="Search customer, product, variant…" autocomplete="off">
        <select class="form-select mbms-filter" id="list-category" aria-label="Category"></select>
        <select class="form-select mbms-filter" id="list-location" aria-label="Location"></select>
        <input class="form-control mbms-date" id="date-from" type="date" aria-label="From date">
        <input class="form-control mbms-date" id="date-to" type="date" aria-label="To date">
      </div>
      <div class="mbms-summary-row" id="list-summary" hidden></div>
      <div id="tx-empty" hidden></div>
      <div class="table-responsive" id="tx-table-wrap">
        <table class="table mbms-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Product</th>
              <th>Variant</th>
              <th>Customer</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Paid</th>
              <th>Type</th>
              <th>Location</th>
              <th>Invoice</th>
            </tr>
          </thead>
          <tbody id="tx-list-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="txModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable mbms-sale-dialog">
      <div class="modal-content mbms-sale-modal">
        <form id="tx-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5"><i class="bi bi-cart-plus" aria-hidden="true"></i> New sale</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mbms-sale-top">
              <div class="mbms-field mb-0 mbms-sale-customer">
                <label class="form-label" for="tx-party">Customer</label>
                <div class="mbms-sale-customer-row">
                  <select class="form-select" id="tx-party" name="party" required data-ac="1" data-ac-placeholder="Type customer name…"></select>
                  <a class="btn btn-outline-primary" id="tx-add-customer" href="customers.html?add=1&amp;return=sales.html">
                    <i class="bi bi-person-plus" aria-hidden="true"></i><span> Add</span>
                  </a>
                </div>
              </div>
              <div class="mbms-field mb-0">
                <label class="form-label" for="tx-date">Date</label>
                <input class="form-control" id="tx-date" name="date" type="date" required>
              </div>
              <div class="mbms-field mb-0">
                <label class="form-label" for="tx-location">Location</label>
                <select class="form-select" id="tx-location" name="location" required></select>
              </div>
            </div>

            <div class="mbms-sale-products">
              <div class="mbms-sale-products-head">
                <h3 class="mbms-sale-products-title"><i class="bi bi-box-seam" aria-hidden="true"></i> Products</h3>
                <button type="button" class="btn btn-sm btn-primary" id="tx-add-line">
                  <i class="bi bi-plus-lg" aria-hidden="true"></i> Add product
                </button>
              </div>
              <div class="mbms-sale-line-labels" aria-hidden="true">
                <span>Category</span>
                <span>Product</span>
                <span>Variant</span>
                <span>Qty</span>
                <span>Price</span>
                <span>Total</span>
                <span></span>
              </div>
              <div id="tx-lines" class="mbms-sale-lines"></div>
            </div>

            <div class="mbms-sale-pay">
              <div class="mbms-field mb-0">
                <label class="form-label" for="tx-payment-type">Payment</label>
                <select class="form-select" id="tx-payment-type" name="payment_type">
                  <option value="cash">Cash</option>
                  <option value="credit">Credit</option>
                </select>
              </div>
              <div class="mbms-field mb-0">
                <label class="form-label" for="tx-paid">Paid</label>
                <input class="form-control" id="tx-paid" name="paid" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
              </div>
              <div class="mbms-field mb-0">
                <label class="form-label" for="tx-remaining">Remaining</label>
                <input class="form-control" id="tx-remaining" name="remaining" inputmode="decimal" min="0" step="0.01" readonly>
              </div>
              <div class="mbms-field mb-0 mbms-sale-notes">
                <label class="form-label" for="tx-notes">Notes <span class="text-secondary fw-normal">(optional)</span></label>
                <input class="form-control" id="tx-notes" name="notes" placeholder="Optional note">
              </div>
            </div>

            <input type="hidden" id="tx-total" name="total" value="">
            <div id="tx-profit-panel" hidden>
              <strong id="tx-cost-display"></strong>
              <strong id="tx-profit-display"></strong>
            </div>
          </div>
          <div class="modal-footer mbms-sale-footer">
            <div class="mbms-sale-footer-total">
              <span>Grand total</span>
              <strong id="tx-total-display">0.00</strong>
            </div>
            <div class="mbms-sale-footer-actions">
              <button type="button" class="btn btn-outline-secondary" id="tx-reset">Reset</button>
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="tx-save-btn">
                <i class="bi bi-check2-circle" aria-hidden="true"></i> Save &amp; invoice
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js?v=20261015j"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/autocomplete.js"></script>
  <script defer src="../assets/js/records.js"></script>
  <script defer src="../assets/js/catalog-lookups.js"></script>
  <script defer src="../assets/js/pages/transaction-page.js?v=20261015j"></script>
  <script defer src="../assets/js/app.js"></script>
</body>
</html>
