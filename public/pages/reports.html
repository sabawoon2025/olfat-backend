<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reports · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
}
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-page="reports">
  <div id="page-content">
    <div id="reports-root">
      <div class="alert alert-warning mbms-source-banner" id="source-banner" hidden></div>
      <div class="mbms-page-header">
        <div>
          <h1 id="report-title"><i class="bi bi-bar-chart-line" aria-hidden="true"></i> Reports</h1>
</div>
        <div class="mbms-page-actions">
          <button type="button" class="btn btn-outline-secondary" id="report-export" title="Download this report as a spreadsheet">Export</button>
        </div>
      </div>
      <div class="d-flex flex-wrap gap-2 mb-3">
        <a class="btn btn-outline-primary" data-report-group="sales" href="reports.html?group=sales">Sales</a>
        <a class="btn btn-outline-primary" data-report-group="purchases" href="reports.html?group=purchases">Purchases</a>
        <a class="btn btn-outline-primary" data-report-group="stock" href="reports.html?group=stock">Stock</a>
        <a class="btn btn-outline-primary" data-report-group="financial" href="reports.html?group=financial">Financial</a>
        <a class="btn btn-outline-primary" data-report-group="workers" href="reports.html?group=workers">Workers</a>
        <a class="btn btn-outline-primary" data-report-group="factory" href="reports.html?group=factory">Factory</a>
        <a class="btn btn-outline-primary" data-report-group="location" href="reports.html?group=location">Location</a>
      </div>
      <div class="d-flex flex-wrap gap-2 mb-3" id="report-kinds"></div>
      <a class="btn btn-primary mb-3" id="pl-link" href="profit-loss.html" hidden>Open Profit &amp; Loss</a>
      <div class="mbms-toolbar" id="report-filters">
        <input class="form-control mbms-search" name="search" type="search" placeholder="Search report">
        <input class="form-control mbms-date" name="date_from" type="date" aria-label="From date">
        <input class="form-control mbms-date" name="date_to" type="date" aria-label="To date">
        <select class="form-select mbms-filter" name="category" aria-label="Category"></select>
        <select class="form-select mbms-filter" name="product" aria-label="Product"></select>
        <select class="form-select mbms-filter" name="customer" aria-label="Customer"></select>
        <select class="form-select mbms-filter" name="supplier" aria-label="Supplier"></select>
        <select class="form-select mbms-filter" name="location" aria-label="Location"></select>
        <select class="form-select mbms-filter" name="transaction_type" aria-label="Transaction type">
          <option value="">All types</option>
          <option value="Purchase">Purchase</option>
          <option value="Sale">Sale</option>
          <option value="Return">Return</option>
          <option value="Damage">Damage</option>
          <option value="Payment">Payment</option>
        </select>
      </div>
      <div class="row g-3 mb-3" id="report-summary"></div>
      <div id="report-empty" hidden></div>
      <div class="table-responsive" id="report-table-wrap">
        <table class="table mbms-table">
          <thead id="report-head"></thead>
          <tbody id="report-body"></tbody>
        </table>
      </div>
      <div class="mbms-pager">
        <button type="button" class="btn btn-outline-secondary" id="pager-prev">Previous</button>
        <span id="pager-status">Page 1 of 1</span>
        <button type="button" class="btn btn-outline-secondary" id="pager-next">Next</button>
      </div>
    </div>
  </div>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/autocomplete.js"></script>
  <script defer src="../assets/js/records.js"></script>
  <script defer src="../assets/js/catalog-lookups.js"></script>
  <script defer src="../assets/js/report-filters.js"></script>
  <script defer src="../assets/js/pages/reports-page.js"></script>
  <script defer src="../assets/js/app.js"></script>
</body>
</html>
