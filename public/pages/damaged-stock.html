<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Damaged Stock · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
}
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-page="damaged-stock">
  <div id="page-content">
    <div id="dmg-root">
      <div class="alert alert-warning mbms-source-banner" id="source-banner" hidden></div>
      <div class="mbms-page-header">
        <div>
          <h1>Damaged Stock</h1>
        </div>
        <div class="mbms-page-actions">
          <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#dmgModal">Record damage</button>
        </div>
      </div>
      <div id="dmg-empty" hidden></div>
      <div class="table-responsive" id="dmg-table-wrap">
        <table class="table mbms-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Product</th>
              <th>Variant</th>
              <th>Quantity</th>
              <th>Reason</th>
              <th>Location</th>
            </tr>
          </thead>
          <tbody id="dmg-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="dmgModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="dmg-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5">Record damage</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mbms-field">
              <label class="form-label" for="dmg-category">Category</label>
              <select class="form-select" id="dmg-category" name="category" required></select>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="dmg-product">Product</label>
              <select class="form-select" id="dmg-product" name="product" required></select>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="dmg-variant">Variant</label>
              <select class="form-select" id="dmg-variant" name="variant" required></select>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="dmg-quantity">Quantity</label>
              <input class="form-control" id="dmg-quantity" name="quantity" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="dmg-unit">Unit</label>
              <input class="form-control" id="dmg-unit" name="unit">
            </div>
            <div class="mbms-field">
              <label class="form-label" for="dmg-reason">Reason</label>
              <textarea class="form-control" id="dmg-reason" name="reason" rows="2" required></textarea>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="dmg-date">Date</label>
              <input class="form-control" id="dmg-date" name="date" type="date" required>
            </div>
            <div class="mbms-field">
              <label class="form-label" for="dmg-location">Location</label>
              <select class="form-select" id="dmg-location" name="location" required></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" id="dmg-reset">Reset</button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-danger">Submit damage</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/records.js"></script>
  <script defer src="../assets/js/catalog-lookups.js"></script>
  <script defer src="../assets/js/pages/damage-page.js"></script>
  <script defer src="../assets/js/app.js"></script>
</body>
</html>
