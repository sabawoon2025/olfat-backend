<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
      }
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-layout="auth" data-page="login">
  <main class="auth-screen">
    <section class="mbms-card card auth-card">
      <div class="card-body p-4 p-sm-5">
        <header class="auth-card-brand">
          <img src="../assets/images/logo.svg" alt="" width="44" height="44" class="auth-card-logo">
          <div>
            <h1 class="auth-card-title">MBMS</h1>
            <p class="auth-card-sub">Sign in to your account</p>
          </div>
        </header>

        <div class="alert alert-danger d-flex align-items-start gap-2" id="login-server-error" hidden>
          <i class="bi bi-exclamation-circle-fill flex-shrink-0 mt-1" aria-hidden="true"></i>
          <span id="login-server-error-text"></span>
        </div>

        <form id="login-form" novalidate>
          <div class="mbms-field">
            <label class="form-label" for="location_id"><i class="bi bi-geo-alt form-label-icon" aria-hidden="true"></i> Province</label>
            <select class="form-select" id="location_id" name="location_id" required>
              <option value="">Select province</option>
            </select>
            <div class="invalid-feedback" data-error-for="location_id">Choose a province.</div>
          </div>

          <div class="mbms-field">
            <label class="form-label" for="email"><i class="bi bi-envelope form-label-icon" aria-hidden="true"></i> Email</label>
            <select class="form-select" id="email" name="email" required>
              <option value="">Select email</option>
            </select>
            <div class="invalid-feedback" data-error-for="email">Choose your email.</div>
          </div>

          <div class="mbms-field">
            <label class="form-label" for="password"><i class="bi bi-key form-label-icon" aria-hidden="true"></i> Password</label>
            <div class="mbms-password-wrap">
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
              <button type="button" class="btn btn-outline-secondary mbms-password-toggle" id="toggle-password" aria-label="Show password">
                <i class="bi bi-eye" id="toggle-password-icon" aria-hidden="true"></i>
              </button>
            </div>
            <div class="invalid-feedback" data-error-for="password">Password is required.</div>
          </div>

          <button type="submit" class="btn btn-primary mbms-btn-block mt-4 auth-submit">
            <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
            Sign in
          </button>
        </form>
      </div>
    </section>
  </main>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/pages/login.js"></script>
  <script defer src="../assets/js/app.js"></script>
</body>
</html>
