<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Suppliers · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
      }
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-page="suppliers" data-contact="suppliers">
  <div id="page-content">
    <div id="contacts-root">
      <div class="alert alert-warning mbms-source-banner" id="source-banner" hidden></div>

      <div id="list-view">
        <div class="mbms-page-header">
          <div>
            <h1><i class="bi bi-truck" aria-hidden="true"></i> Suppliers</h1>
            <p class="mbms-help mb-0">Payable balances update from purchases and supplier payments in Laravel.</p>
          </div>
          <div class="mbms-page-actions">
            <a class="btn btn-outline-secondary" href="purchases.html">
              <i class="bi bi-bag" aria-hidden="true"></i> Purchases
            </a>
            <button type="button" class="btn btn-primary" id="add-contact" data-bs-toggle="modal" data-bs-target="#contactModal">
              <i class="bi bi-person-plus" aria-hidden="true"></i> Add supplier
            </button>
          </div>
        </div>
        <div class="mbms-toolbar">
          <input class="form-control mbms-search" id="module-search" type="search" placeholder="Search name, phone, address…" autocomplete="off">
        </div>
        <div class="mbms-summary-row" id="list-summary" hidden></div>
        <div id="contact-empty" hidden></div>
        <div class="table-responsive mbms-scroll-panel" id="contact-table-wrap">
          <table class="table mbms-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Payable</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="contact-list-body"></tbody>
          </table>
        </div>
      </div>

      <div id="detail-view" hidden>
        <div class="mbms-page-header">
          <div>
            <a class="btn btn-outline-secondary btn-sm mb-2" href="suppliers.html"><i class="bi bi-arrow-left"></i> Back to suppliers</a>
            <h1 id="detail-title"><i class="bi bi-truck" aria-hidden="true"></i> Supplier</h1>
            <p class="mbms-detail-meta">
              <span id="detail-phone"></span>
              <span>·</span>
              <span id="detail-address"></span>
            </p>
          </div>
          <div class="mbms-page-actions">
            <a class="btn btn-outline-primary" id="detail-new-purchase" href="purchases.html">
              <i class="bi bi-bag-plus" aria-hidden="true"></i> New purchase
            </a>
            <button type="button" class="btn btn-outline-secondary" id="edit-contact" data-bs-toggle="modal" data-bs-target="#contactModal">
              <i class="bi bi-pencil" aria-hidden="true"></i> Edit
            </button>
          </div>
        </div>

        <div class="mbms-summary-row" id="detail-summary"></div>

        <ul class="nav nav-tabs mbms-nav-tabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-purchases" type="button">Purchase history</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-payments" type="button">Payment history</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-transactions" type="button">All activity</button></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="tab-purchases">
            <div class="table-responsive">
              <table class="table mbms-table">
                <thead><tr><th>Date</th><th>Detail</th><th>Amount</th></tr></thead>
                <tbody id="purchase-history-body"></tbody>
              </table>
            </div>
          </div>
          <div class="tab-pane fade" id="tab-payments">
            <div class="table-responsive">
              <table class="table mbms-table">
                <thead><tr><th>Date</th><th>Amount</th><th>Note</th><th>Location</th></tr></thead>
                <tbody id="payment-history-body"></tbody>
              </table>
            </div>
          </div>
          <div class="tab-pane fade" id="tab-transactions">
            <div class="table-responsive">
              <table class="table mbms-table">
                <thead><tr><th>Date</th><th>Type</th><th>Detail</th><th>Amount</th></tr></thead>
                <tbody id="transaction-history-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content mbms-contact-modal">
        <form id="contact-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="contact-form-title"><i class="bi bi-person-plus" aria-hidden="true"></i> Add supplier</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="id" id="contact-id">
            <div class="mbms-form-section is-supplier">
              <div class="mbms-form-section-title"><i class="bi bi-truck" aria-hidden="true"></i> Supplier details</div>
              <div class="mbms-field">
                <label class="form-label" for="contact-name">Supplier name</label>
                <input class="form-control" id="contact-name" name="name" required autocomplete="organization" placeholder="Supplier name">
              </div>
              <div class="mbms-field">
                <label class="form-label" for="contact-phone">Phone / contact</label>
                <input class="form-control" id="contact-phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="Optional">
              </div>
              <div class="mbms-field">
                <label class="form-label" for="contact-address">Address</label>
                <input class="form-control" id="contact-address" name="address" autocomplete="street-address" placeholder="Optional">
              </div>
              <div class="mbms-field mb-0">
                <label class="form-label" for="contact-notes">Notes <span class="text-secondary fw-normal">(optional)</span></label>
                <textarea class="form-control" id="contact-notes" name="notes" rows="2" placeholder="Anything useful about this supplier"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save supplier</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/autocomplete.js"></script>
  <script defer src="../assets/js/records.js"></script>
  <script defer src="../assets/js/pages/contacts-page.js"></script>
  <script defer src="../assets/js/app.js"></script>
</body>
</html>
