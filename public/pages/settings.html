<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Settings · MBMS</title>
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <script>
    try {
      if (localStorage.getItem('MBMS_LANG') === 'fa') {
        document.documentElement.lang = 'fa';
        document.documentElement.dir = 'rtl';
        var sheet = document.querySelector('link[href*="bootstrap.min.css"]');
        if (sheet) sheet.href = sheet.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
      }
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-page="settings">
  <div id="page-content">
    <div id="settings-root">
      <div class="alert alert-warning mbms-source-banner" id="source-banner" hidden></div>
      <div class="mbms-page-header">
        <div>
          <h1><i class="bi bi-gear" aria-hidden="true"></i> Settings</h1>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-12 col-lg-6">
          <section class="mbms-card card h-100">
            <div class="card-header mbms-card-header"><i class="bi bi-person-circle" aria-hidden="true"></i> Profile</div>
            <div class="card-body">
              <form id="profile-form" novalidate>
                <div class="mbms-field">
                  <label class="form-label" for="profile-name">Name</label>
                  <input class="form-control" id="profile-name" name="name" required>
                </div>
                <div class="mbms-field">
                  <label class="form-label" for="profile-email">Email</label>
                  <input class="form-control" id="profile-email" name="email" type="email" required>
                </div>
                <div class="mbms-field">
                  <label class="form-label" for="profile-location">Province</label>
                  <select class="form-select" id="profile-location" name="location" disabled></select>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle" aria-hidden="true"></i> Save profile</button>
              </form>
            </div>
          </section>
        </div>
        <div class="col-12 col-lg-6">
          <section class="mbms-card card h-100">
            <div class="card-header mbms-card-header"><i class="bi bi-shield-lock" aria-hidden="true"></i> Account</div>
            <div class="card-body">
              <form id="password-form" novalidate>
                <div class="mbms-field">
                  <label class="form-label" for="current-password">Current password</label>
                  <input class="form-control" id="current-password" name="current_password" type="password" required>
                </div>
                <div class="mbms-field">
                  <label class="form-label" for="new-password">New password</label>
                  <input class="form-control" id="new-password" name="password" type="password" required>
                </div>
                <div class="mbms-field">
                  <label class="form-label" for="confirm-password">Confirm new password</label>
                  <input class="form-control" id="confirm-password" name="password_confirmation" type="password" required>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-shield-lock" aria-hidden="true"></i> Update password</button>
              </form>
            </div>
          </section>
        </div>
        <div class="col-12 col-lg-6">
          <section class="mbms-card card h-100">
            <div class="card-header mbms-card-header"><i class="bi bi-palette" aria-hidden="true"></i> Appearance</div>
            <div class="card-body">
              <div class="mbms-field">
                <label class="form-label">Language</label>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="language" id="language-en" value="en">
                  <label class="form-check-label" for="language-en">English</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="language" id="language-fa" value="fa">
                  <label class="form-check-label" for="language-fa" data-i18n-skip>فارسی</label>
                </div>
              </div>
              <div class="mbms-field">
                <label class="form-label">Display density</label>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="density" id="density-comfortable" value="comfortable" checked>
                  <label class="form-check-label" for="density-comfortable">Comfortable</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="density" id="density-compact" value="compact">
                  <label class="form-check-label" for="density-compact">Compact</label>
                </div>
              </div>
            </div>
          </section>
        </div>
        <div class="col-12 col-lg-6">
          <section class="mbms-card card h-100">
            <div class="card-header mbms-card-header"><i class="bi bi-hdd-network" aria-hidden="true"></i> Application</div>
            <div class="card-body">
              <form id="app-form" novalidate>
                <div class="mbms-field">
                  <label class="form-label" for="api-base">API base URL</label>
                  <input class="form-control" id="api-base" name="api_base_url" required>
                </div>
                <div class="d-flex flex-wrap gap-2">
                  <button type="submit" class="btn btn-primary"><i class="bi bi-hdd-network" aria-hidden="true"></i> Save API URL</button>
                  <button type="button" class="btn btn-outline-secondary" id="reset-api"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Reset default</button>
                </div>
              </form>
            </div>
          </section>
        </div>

        <!-- =====================================================
             Admin-only: Business identity (printed on invoices)
             ===================================================== -->
        <div class="col-12" id="business-section" hidden>
          <section class="mbms-card card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span class="mbms-card-header"><i class="bi bi-building" aria-hidden="true"></i> Business identity</span>
              <span class="badge text-bg-primary">Admin only</span>
            </div>
            <div class="card-body">
              <form id="business-form" novalidate>
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="biz-legal-name">Legal business name</label>
                    <input class="form-control" id="biz-legal-name" name="business.legal_name">
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="biz-tagline">Tagline / document caption</label>
                    <input class="form-control" id="biz-tagline" name="business.tagline" placeholder="Sales Invoice">
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="biz-logo-url">Logo URL</label>
                    <input class="form-control" id="biz-logo-url" name="business.logo_url" placeholder="/assets/images/logo.svg">
                    <small class="text-secondary">Public URL or path relative to the site root.</small>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="biz-tax-id">Tax ID / registration number</label>
                    <input class="form-control" id="biz-tax-id" name="business.tax_id">
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="biz-address-1">Address line 1</label>
                    <input class="form-control" id="biz-address-1" name="business.address_line1">
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="biz-address-2">Address line 2</label>
                    <input class="form-control" id="biz-address-2" name="business.address_line2">
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="biz-phone">Phone</label>
                    <input class="form-control" id="biz-phone" name="business.phone">
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="biz-email">Email</label>
                    <input class="form-control" id="biz-email" name="business.email" type="email">
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="biz-website">Website</label>
                    <input class="form-control" id="biz-website" name="business.website">
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="biz-currency-code">Currency code</label>
                    <input class="form-control" id="biz-currency-code" name="app.currency_code" placeholder="AFN">
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="biz-currency-symbol">Currency symbol</label>
                    <input class="form-control" id="biz-currency-symbol" name="app.currency_symbol" placeholder="؋">
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="biz-currency-position">Currency position</label>
                    <select class="form-select" id="biz-currency-position" name="app.currency_position">
                      <option value="suffix">After amount — 100 ؋</option>
                      <option value="prefix">Before amount — $ 100</option>
                    </select>
                  </div>
                </div>
<button type="submit" class="btn btn-primary"><i class="bi bi-building" aria-hidden="true"></i> Save business identity</button>
              </form>
            </div>
          </section>
        </div>

        <!-- =====================================================
             Admin-only: Invoice / bill content
             ===================================================== -->
        <div class="col-12" id="invoice-section" hidden>
          <section class="mbms-card card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span class="mbms-card-header"><i class="bi bi-receipt" aria-hidden="true"></i> Invoice content</span>
              <span class="badge text-bg-primary">Admin only</span>
            </div>
            <div class="card-body">
              <form id="invoice-form" novalidate>
                <div class="row g-3">
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="inv-prefix">Invoice number prefix</label>
                    <input class="form-control" id="inv-prefix" name="invoice.prefix" placeholder="INV">
                  </div>
                  <div class="col-12 col-md-8">
                    <label class="form-label" for="inv-header-note">Header note (optional)</label>
                    <input class="form-control" id="inv-header-note" name="invoice.header_note">
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="inv-footer-note">Footer note</label>
                    <input class="form-control" id="inv-footer-note" name="invoice.footer_note" placeholder="Thank you for your business.">
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="inv-terms">Terms &amp; conditions</label>
                    <textarea class="form-control" id="inv-terms" name="invoice.terms" rows="4"></textarea>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="inv-bank">Bank / payment details</label>
                    <textarea class="form-control" id="inv-bank" name="invoice.bank_details" rows="4" placeholder="Bank name, Account name, Account number"></textarea>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="inv-sign-customer">Customer signature label</label>
                    <input class="form-control" id="inv-sign-customer" name="invoice.signature_customer_label" placeholder="Customer signature">
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="inv-sign-authorized">Authorized signature label</label>
                    <input class="form-control" id="inv-sign-authorized" name="invoice.signature_authorized_label" placeholder="Authorized signature">
                  </div>
                  <div class="col-12">
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox" id="inv-watermark" name="invoice.show_watermark">
                      <label class="form-check-label" for="inv-watermark">Show diagonal PAID / UNPAID / PARTIAL watermark on invoices</label>
                    </div>
                  </div>
                </div>
<div class="d-flex flex-wrap gap-2">
                  <button type="submit" class="btn btn-primary"><i class="bi bi-receipt" aria-hidden="true"></i> Save invoice settings</button>
                  <a class="btn btn-outline-secondary" href="bill.html" target="_blank" rel="noopener">
                    <i class="bi bi-box-arrow-up-right"></i> Preview a bill
                  </a>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script defer src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>window.MBMS_BASE_PATH = '..';</script>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/i18n.js"></script>
  <script defer src="../assets/js/api.js"></script>
  <script defer src="../assets/js/bridge.js"></script>
  <script defer src="../assets/js/utils.js"></script>
  <script defer src="../assets/js/ui.js"></script>
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/auth.js"></script>
  <script defer src="../assets/js/layout.js"></script>
  <script defer src="../assets/js/autocomplete.js"></script>
  <script defer src="../assets/js/records.js"></script>
  <script defer src="../assets/js/pages/settings-page.js"></script>
  <script defer src="../assets/js/app.js"></script>
</body>
</html>
